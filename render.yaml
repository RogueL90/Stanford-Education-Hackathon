services:
  - type: web
    name: clearread
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: PIONEER_API_KEY
        sync: false
      - key: PIONEER_MODEL
        value: claude-haiku-4.5
      - key: PIONEER_BASE_URL
        value: https://api.pioneer.ai/v1
